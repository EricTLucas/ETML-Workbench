[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eda_tool"
version = "0.6.0"
description = "ETML Workbench: EDA, preprocessing, model experiments and prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.9",
  "wordcloud>=1.9",
  "pyarrow>=14",
  "scikit-learn>=1.4",
  "skops>=0.10"
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]
onnx = ["skl2onnx>=1.17", "onnxruntime>=1.18"]
pytorch = ["torch>=2.6"]
tensorflow = ["tensorflow>=2.18"]

[project.scripts]
workbench = "etml.cli:main"
eda = "eda_tool.cli:legacy_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["etml*", "eda_tool*", "data", "data.*", "preprocessing", "preprocessing.*", "workflows", "workflows.*", "tasks", "tasks.*", "splitting", "splitting.*", "models", "models.*", "training", "training.*", "prediction", "prediction.*", "exporting", "exporting.*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
