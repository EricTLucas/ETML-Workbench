[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eda_tool"
version = "0.18.0"
description = "ETML Workbench: EDA, preprocessing, model experiments and prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.9",
  "wordcloud>=1.9",
  "pyarrow>=14",
  "scikit-learn>=1.4",
  "skops>=0.10",
  "packaging>=23"
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]
lightgbm = ["lightgbm>=4.0"]
catboost = ["catboost>=1.2"]
boosting = ["xgboost>=2.0", "lightgbm>=4.0", "catboost>=1.2"]
vision = ["torch>=2.6", "torchvision>=0.21", "Pillow>=10"]
text = ["torch>=2.6", "transformers>=4.45,<6", "safetensors>=0.4", "sentencepiece>=0.2"]
timeseries = ["statsmodels>=0.14"]
recommendation = ["implicit>=0.7"]
onnx = ["skl2onnx>=1.17", "onnxruntime>=1.18"]
pytorch = ["torch>=2.6"]
tensorflow = ["tensorflow>=2.18"]
huggingface = ["datasets>=4.0"]
ui = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.18"]
test-ui = ["httpx>=0.27"]

[project.scripts]
workbench = "etml.cli:main"
eda = "eda_tool.cli:legacy_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["etml*", "eda_tool*", "data", "data.*", "preprocessing", "preprocessing.*", "workflows", "workflows.*", "tasks", "tasks.*", "splitting", "splitting.*", "models", "models.*", "training", "training.*", "prediction", "prediction.*", "exporting", "exporting.*"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
"etml.web" = ["static/*.html", "static/*.css", "static/*.js"]
